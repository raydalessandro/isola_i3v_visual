sid: s10
title: La Notte senza Luna
note: |
  Annotazioni operative per ogni hook (ground truth dalla prosa, sovrascrivono il NER fuzzy).
  Per ogni hook narrativo (h01..h10):
  - location: id luogo canonico DOVE SUCCEDE LA SCENA (1 solo, deve esistere in entities.locations)
  - characters_in_scene: personaggi fisicamente in scena (id da entities.characters)
  - characters_offscreen_or_distant: personaggi citati ma non in scena (es. sagome lontane, cammei sonori)
  - objects_in_scene: oggetti canonici visibili (id da entities.objects)
  - canonical_details: dettagli stabili (es. dettagli Tier A path_details, vincoli scena)
  - pov: punto di vista del lettore in frase tecnica esplicita (inglese) — blocco obbligatorio del prompt (skill scenografo §2-ter); distillato dal punto di vista già implicito nella note
  - subhooks: lista sotto-hook se l'hook è splittato in più pagine libro (default: 1 sotto-hook = 1 pagina)
                Il campo page_book può essere int (1 pagina) o lista [N, N+1] per spread doppia.
  Le note subhook sono il BLOCCO SCENA del prompt illustratore: coprono beat, azione focale,
  inquadratura, varianti atmosferiche e continuità. NON ripetono stile (stylesheet), tratti
  fisici (schede + scale GU) né firme ambientali (prompt_grok). La quiet zone alta (~25-30%
  per il testo di pagina) è vincolo dello stylesheet e vale per ogni scena.

  VINCOLI TRASVERSALI DI s10 (valgono per OGNI subhook, non ripetuti nelle note):
  - `night_not_personified`: il buio è oggettivo — mai occhi, volti, artigli, presenze nel nero.
    Nessuna figura minacciosa, nessuna ombra antropomorfa, nessun mostro suggerito.
  - `fears_resolved_by_brothers_only`: nessun adulto in scena fino a h09. Nessuno consola, mai.
  - Nessuna stella, mai: cielo coperto da nubi basse (realismo autunnale). Nessuna luna.
  - Nessuna fonte di luce oltre la lanterna velata di Elias, fino all'alba naturale di h08-h10.
  - Il cerchio di luce è PICCOLO — 50-60 cm davanti ai piedi, a livello delle ginocchia.
    Mai cono ampio di torcia moderna, mai fascio direzionale, mai bagliore diffuso.
  - Autunno avanzato notturno: mantello di lana ognuno sopra il pigiama, calze, sandali.
    La lana si inumidisce col procedere del cammino (h06 in poi, resa nei toni non nei dettagli).
  - Braccialetto di s09 NON al polso di Gabriel (vincolo ARCHI: castagna rugata solo in s12).
  - Noah in modalità `aggrappato` (scheda noah §Modalità) da h02 a h10: postura più piccola del
    normale, vicino ai fratelli, bocca chiusa, mai pianto melodrammatico.
  - Grunto solo acustico (h07): mai visto, mai sagoma, mai nominato.
  - Nessun testo, nessuna onomatopea disegnata: TOK, tot tot tot e splash sono resa tipografica
    del compositore libro.

  NOTA SULLA QUIET ZONE IN s10: nelle tavole notturne (h01-h07) la fascia alta è nero pieno
  o quasi — è la quiet zone più semplice della saga. Non riempirla di dettagli "per non
  lasciarla vuota": il vuoto in alto È il soggetto.

book_pages_total: 21

hooks:

  s10_h01:
    location: piazza_villaggio
    location_variant: interno_casa_fratelli_non_cartografato_notte_fonda_luna_nuova
    characters_in_scene: [noah, gabriel, elias]
    characters_offscreen_or_distant: [coltivatori_del_cerchio]
    objects_in_scene: [nido_vuoto_s08]
    canonical_details:
      - "Apertura: notte fonda, luna NUOVA — «quelle notti in cui il cielo non manda niente, e dentro le case è buio come sotto una coperta». Imposte serrate, non entra niente"
      - "Tre letti nella stessa stanza: Gabriel e Elias dormono (respiro regolare), Noah no — sdraiato sul fianco, occhi aperti"
      - "Sul comodino accanto alla testa di Noah: il nido vuoto preso dietro il Pozzo in s08 e portato a casa. VINCOLO: «Adesso non lo vedeva. Sapeva che era lì» — il nido è visibile al LETTORE come accenno di rametti, non a Noah"
      - "Il nido è centro ottico MARGINALE: piccolo, non al centro della tavola, ma trovabile"
      - "VINCOLO ARREDO (canonical json): NIENTE orologio, NIENTE lume da notte, NIENTE oggetti superflui — spoglio canonico. Coperte di lana ruvida, lenzuolo bianco-avorio appena percepibile"
      - "Eco spenta della cantilena serale dei Coltivatori: fuori non si sente più niente. Offscreen puro, non illustrato"
      - "Palette: nero quasi pieno, micro-accenni avorio del lenzuolo, marrone scuro dei rametti del nido, un solo riflesso minimo sull'occhio aperto di Noah"
    subhooks:
      - id: s10_h01a
        page_book: 1
        text_split_marker: "Era notte fonda"
        image_status: TBD
        pov: "eye-level from the dark room, wide enough to read the three beds side by side, closed shutters at the back, no light source in frame"
        note: "La stanza al buio pieno — tavola d'apertura: i tre letti accostati letti come volumi appena più chiari del nero, le coperte di lana ruvida, le imposte serrate in fondo senza una fessura di luce. Gabriel ed Elias dormono, corpi distesi e quieti; Noah sul fianco è l'unica forma sveglia. Nessuna fonte di luce: la stanza si legge per differenze minime di nero e per il bianco-avorio quasi invisibile del lenzuolo. Composizione ampia e ferma: il bambino lettore deve capire dove siamo prima di capire chi non dorme. La fascia alta è nero pieno."
      - id: s10_h01b
        page_book: 2
        text_split_marker: "Noah era sdraiato sul fianco"
        image_status: TBD
        pov: "low close view at pillow height on Noah lying on his side, the bedside table with the nest just inside the frame edge"
        note: "L'occhio aperto e il nido — pagina-dettaglio: primo piano basso all'altezza del cuscino su Noah sdraiato sul fianco, capelli un po' arruffati sul lato, la bocca chiusa, e un unico riflesso tenue sull'occhio aperto che guarda il nero. Al margine dell'inquadratura, sul comodino, il nido vuoto di s08 — rametti intrecciati e muschio secco appena leggibili nel buio, piccoli, non spiegati. Noah non lo guarda: guarda davanti a sé. Il lettore lo vede, lui lo sa. Intimità massima, zero melodramma."

  s10_h02:
    location: piazza_villaggio
    location_variant: interno_casa_fratelli_non_cartografato_buio_assoluto
    characters_in_scene: [noah, gabriel]
    characters_offscreen_or_distant: [elias]
    objects_in_scene: []
    canonical_details:
      - "HOOK FIRMA — la pagina più nera della saga. L'illustratore deve RESISTERE alla tentazione di aggiungere luce"
      - "KEY PHRASE alla lettera, sola voce di Noah in tutta la storia: «Ho paura.» — silenzio — «Qui è buio.» Cinque parole, due frasi, una pausa nel mezzo. Il testo è del compositore: nell'immagine NON c'è testo"
      - "Noah non si muove, non piange, non chiama nessuno. Dice e basta"
      - "Gabriel era già sveglio — «Non si sa se si era svegliato adesso o prima». Nessuna parola: tende la mano nel buio, nello spazio fra i due letti, e cerca"
      - "VINCOLO: due soli punti-luce-riflesso in tutta la tavola — l'occhio aperto di Noah e il contorno della mano di Gabriel. Il resto è nero pieno"
      - "Elias offscreen nel terzo letto: si sta alzando, percepibile SOLO dal lenzuolo che si sposta. Non ancora in piedi, non ancora un volto"
      - "Le due mani si trovano e si tengono: fine del beat, page-turn"
    subhooks:
      - id: s10_h02a
        page_book: 3
        text_split_marker: "Poi Noah disse, ad alta voce nel buio"
        image_status: TBD
        pov: "very tight close-up on Noah's face in near-total black, only the faint reflection on his open eye legible, mouth just parted"
        note: "Le cinque parole — la tavola più nera: primissimo piano sul volto di Noah nel nero quasi totale, con la bocca appena aperta nell'istante in cui dice. Un solo riflesso tenue sull'occhio aperto; il contorno del viso e del cuscino si intuisce per differenze minime di nero, senza contorni nitidi. Nessun'altra forma nella tavola. La pagina deve sembrare quasi vuota e non lo è: è un bambino che parla al buio. Fascia alta interamente nera."
      - id: s10_h02b
        page_book: 4
        text_split_marker: "Tese la mano nel buio"
        image_status: TBD
        pov: "low horizontal view across the gap between the two beds, Gabriel's arm entering from the left, reaching into the dark, Noah's hand not yet touching"
        note: "La mano che cerca: vista orizzontale bassa nello spazio nero tra i due letti — dalla sinistra entra il braccio di Gabriel, teso, la mano aperta che cerca senza vedere; dalla destra la mano piccola di Noah, ancora a qualche centimetro. Le due mani NON si toccano in questa pagina: la tavola è tutta nell'attesa. Solo i contorni delle dita hanno un riflesso lievissimo; tutto il resto è nero. La distanza tra le due mani è il soggetto compositivo."
      - id: s10_h02c
        page_book: 5
        text_split_marker: "Si tennero"
        image_status: TBD
        pov: "tight close-up on the two joined hands in the black gap between beds, nothing else in frame"
        note: "Si tennero — pagina-icona muta: primo piano stretto sulle due mani che si sono trovate e si tengono, sospese nel nero tra i due letti. La mano grande e la mano piccola, le dita intrecciate senza stringere troppo. Nient'altro nell'inquadratura: né volti, né letti, né stanza. È la risposta di Gabriel, e non è una parola. Tenerezza senza dolcezza aggiunta: due mani, il nero, basta."

  s10_h03:
