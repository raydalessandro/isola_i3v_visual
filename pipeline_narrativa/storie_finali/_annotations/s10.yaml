        note: "Il fiammifero: tre quarti ravvicinato sulle mani e sul volto di Elias in cucina, illuminati dal basso dalla fiamma piccola del fiammifero che sta portando allo stoppino — l'unico punto caldo in una stanza altrimenti nera. La cucina si intuisce per pochissimo: il bordo di un tavolo, il taglio di un cassetto socchiuso. Il viso è concentrato, sveglissimo, senza paura e senza eroismo: un bambino che fa una cosa che sa fare. Il giallo caldo è minuscolo nella tavola nera."
