      - "«Nessuno disse niente. Nessuno si voltò. Continuarono.» — VINCOLO: nessuno dei tre gira la testa. La reazione è tutta nel non-reagire"
      - "Onomatopea tot tot tot: piccolissima, in alto a destra, distante. Resa tipografica del compositore — MAI testo nell'immagine"
