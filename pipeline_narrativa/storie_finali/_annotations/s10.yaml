      - "NASCITA DELL'OGGETTO-SIMBOLO: il panno di lana vecchia avvolto TRE-QUARTI attorno al vetro tondo, in modo che la luce esca solo dal basso, in un cerchio piccolo per terra. Vetro tondo con riflesso giallo interno, sportellino metallico parzialmente coperto"
      - "VINCOLO CANONE (`ELIAS_GESTO_VELATURA_LANTERNA_NON_SPIEGATO`): il gesto si mostra, non si spiega. Nessun didascalismo, nessuna sequenza a step"
      - "Inversione speculare di s08_h10 (Mèmolo copre il nido con una foglia per proteggerlo dal vento — qui Elias copre la luce per proteggere i fratelli dal buio). Non dichiarata: solo l'eco del gesto"
      - "Elias solo in scena: i fratelli restano nella stanza, offscreen"
      - "Palette: nero della cucina, giallo caldo della prima fiamma, ocra del panno di lana, marrone delle dita di Elias"
      - "Onomatopea scric: resa tipografica del compositore, mai nell'immagine"
