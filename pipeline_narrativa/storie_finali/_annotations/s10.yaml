      - "Le tre presenze canoniche della Piazza ridotte a valori di nero: l'Albero Vecchio «una sagoma più nera del nero», il Pozzo «una macchia grigia chiara» contro il selciato"
      - "Mèmolo offscreen puro: «dormiva da qualche parte». NON illustrato, nemmeno come finestra"
      - "L'angolo del viottolo dove di sera il Mulinello fa sempre un giro di foglie: stanotte è FERMO. Niente foglie, solo silenzio — il vento si nota per la sua assenza"
      - "Cornice s10_c2 (Processo B, speculare a s01_c1): un mantenitore FRINGUELLO apre la porta di casa con la scopa in mano; la scopa tocca il selciato — TOK singolo (saluto del gruppo). «I tre annuirono. Lui annuì. La giornata cominciò di lì.»"
      - "VINCOLO COLLETTIVI: il mantenitore non è individuato per nome, specie fringuello solo qui in tutta la saga. Oggetto-firma: la scopa (non la scala a pioli, che è il simbolo generale del gruppo)"
      - "Il mantenitore appare SOLO nel subhook b"
      - "Il freddo è oggettivo: selciato freddo sotto le scarpe, aria umida che bagna la lana"
